},\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 51\n      },\n      \"id\": 132,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"showPercentChange\": false,\n        \"textMode\": \"auto\",\n        \"wideLayout\": true\n      },\n      \"pluginVersion\": \"10.4.19\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"000000001\"\n          },\n          \"expr\": \"count(kube_deployment_status_replicas_available{deployment=~\\\".*-(kubeconfig|konk-service-apiservice|kubectl-apiservice)\\\"} < 1)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"unavailable\"\n        }\n      ],\n      \"title\": \"Deployments unavailable\",\n      \"type\": \"stat\",\n      \"description\": \"kubeconfig or apiservice Deployments with no available replica.\",\n      \"links\": [\n        {\n          \"title\": \"Drill down: konk-services\",\n          \"url\": \"/d/konk-services-infoblox/konk-services\",\n          \"targetBlank\": false\n        }\n      ]\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"000000001\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 51\n      },\n      \"id\": 133,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"showPercentChange\": false,\n        \"textMode\": \"auto\",\n        \"wideLayout\": true\n      },\n      \"pluginVersion\": \"10.4.19\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"000000001\"\n          },\n          \"expr\": \"count(kube_pod_status_ready{pod=~\\\".*konk-service.*\\\", condition=\\\"true\\\"} == 0)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"not ready\"\n        }\n      ],\n      \"title\": \"konk-service pods not Ready\",\n      \"type\": \"stat\",\n      \"description\": \"konk-service pods failing their readiness probe. Matches '.*konk-service.*'; the previous component-suffix regex missed pods whose names Kubernetes truncated.\",\n      \"links\": [\n        {\n          \"title\": \"Drill down: konk-services\",\n          \"url\": \"/d/konk-services-infoblox/konk-services\",\n          \"targetBlank\": false\n        }\n      ]\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"000000001\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [],\n          \"decimals\": 2,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": -99999\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 2\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 4\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 6\n              }\n            ]\n          },\n          \"noValue\": \"no metrics\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 51\n      },\n      \"id\": 134,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"showPercentChange\": false,\n        \"textMode\": \"auto\",\n        \"wideLayout\": true\n      },\n      \"pluginVersion\": \"10.4.19\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"000000001\"\n          },\n          \"expr\": \"min((certmanager_certificate_expiration_timestamp_seconds{name=~\\\".*kubeconfig.*\\\"} - time()) / 3600)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"hours\"\n        }\n      ],\n      \"title\": \"Min kubeconfig cert remaining (h)\",\n      \"type\": \"stat\",\n      \"description\": \"Worst-case kubeconfig client cert across the fleet. 12h TTL, so below 2h is critical.\",\n      \"links\": [\n        {\n          \"title\": \"Drill down: konk-services\",\n          \"url\": \"/d/konk-services-infoblox/konk-services\",\n          \"targetBlank\": false\n        }\n      ]\n    }\n  ],\n  \"refresh\": \"\",\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"konk\",\n    \"konk-operator\"\n  ],\n  \"templating\": {\n    \"list\": []\n  },\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"timepicker\": {\n    \"refresh_intervals\": [\n      \"5s\",\n      \"10s\",\n      \"30s\",\n      \"1m\",\n      \"5m\",\n      \"15m\",\n      \"30m\",\n      \"1h\",\n      \"2h\",\n      \"1d\"\n    ]\n  },\n  \"timezone\": \"\",\n  \"title\": \"konk-operator (test)\",\n  \"uid\": \"8wi8LhdGk-test\",\n  \"version\": 332,\n  \"weekStart\": \"\"\n}"
