er\": [\n            \"sum\"\n          ],\n          \"show\": false\n        },\n        \"showHeader\": true\n      },\n      \"pluginVersion\": \"10.4.19\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"000000001\"\n          },\n          \"expr\": \"max by (namespace, name) (certmanager_certificate_ready_status{namespace=\\\"aggregate\\\", condition=\\\"True\\\"}) == 0\",\n          \"format\": \"table\",\n          \"instant\": true,\n          \"range\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"cert-manager Certificates not Ready\",\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"__name__\": true,\n              \"job\": true,\n              \"instance\": true,\n              \"endpoint\": false,\n              \"container\": false,\n              \"uid\": true,\n              \"prometheus\": true,\n              \"service\": true,\n              \"condition\": true,\n              \"exported_namespace\": true,\n              \"cluster\": true,\n              \"env\": true\n            },\n            \"includeByName\": {},\n            \"renameByName\": {\n              \"Value\": \"not ready\",\n              \"name\": \"certificate\",\n              \"namespace\": \"namespace\"\n            }\n          }\n        }\n      ],\n      \"type\": \"table\",\n      \"description\": \"Any row here is a Certificate cert-manager could not issue. Alert on any.\"\n    },\n    {\n      \"collapsed\": false,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"000000001\"\n      },\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 50\n      },\n      \"id\": 130,\n      \"panels\": [],\n      \"title\": \"KonkService Summary\",\n      \"type\": \"row\"