apiVersion: v1
kind: Pod
metadata:
  name: {{ include "example-apiserver.fullname" . }}-test
  labels:
    {{- include "example-apiserver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
    "helm.sh/hook": test
spec:
  containers:
  - name: example-test
    image: "{{ .Values.kind.image.repository }}:{{ .Values.kind.image.tag | default .Chart.AppVersion }}"
    command: ["/usr/local/bin/konk-service", "example-test"]
    env:
    - name: KUBECONFIG
      value: /kubeconfig/admin.conf
    - name: GROUP
      value: example.infoblox.com
    - name: VERSION
      value: v1alpha1
    - name: KIND
      value: Contact
    - name: RESOURCE
      value: contacts
    - name: SAMPLE_NAME
      value: contact-example
    volumeMounts:
    - name: kubeconfig
      mountPath: /kubeconfig
      readOnly: true
  restartPolicy: Never
  volumes:
  - name: kubeconfig
    secret:
      secretName: {{ include "example-apiserver.konk-service-name" . }}-kubeconfig
