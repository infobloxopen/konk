# Custom etcd Helm chart values
# Uses upstream etcd image from gcr.io/etcd-development/etcd

## @section Global parameters
global:
  imageRegistry: ""
  imagePullSecrets: []

## @section etcd image parameters
image:
  # Primary registry: gcr.io/etcd-development/etcd
  # Secondary registry: quay.io/coreos/etcd
  registry: gcr.io
  repository: etcd-development/etcd
  tag: "v3.6.9"
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section etcd cluster parameters
replicaCount: 1

## @section etcd configuration
etcd:
  # Initial cluster state: "new" or "existing"
  initialClusterState: ""
  # Initial cluster token
  initialClusterToken: "etcd-cluster"
  # Data directory inside the container
  dataDir: /var/lib/etcd
  # Enable auto compaction
  autoCompactionMode: periodic
  autoCompactionRetention: "1h"

## @section Security parameters
auth:
  rbac:
    enabled: false
    rootPassword: ""
    existingSecret: ""
  client:
    secureTransport: false
    useAutoTLS: false
    enableAuthentication: false
    existingSecret: ""
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    secureTransport: false
    useAutoTLS: false
    enableAuthentication: false
    existingSecret: ""
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt

## @section Service parameters
service:
  type: ClusterIP
  port: 2379
  peerPort: 2380
  annotations: {}
  clientPortNameOverride: ""
  peerPortNameOverride: ""

## @section Persistence parameters
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

## @section Pod parameters
podAnnotations: {}
podLabels: {}

securityContext:
  enabled: true
  fsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## @section Resource parameters
resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 256Mi

## @section Probe parameters
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

startupProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1

## @section Scheduling parameters
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

## @section Cluster parameters
clusterDomain: cluster.local

## @section Metrics parameters
metrics:
  enabled: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2379"
