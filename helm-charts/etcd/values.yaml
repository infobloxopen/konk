# Custom etcd Helm chart values
# Uses Chainguard etcd image from cgr.dev/infoblox.com

## @section Global parameters
global:
  imageRegistry: ""
  imagePullSecrets: []

## @section etcd image parameters
image:
  registry: cgr.dev
  repository: infoblox.com/etcd
  tag: "3.7.1"
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section etcd cluster parameters
replicaCount: 1

## @section etcd configuration
etcd:
  # Initial cluster state: "new" or "existing"
  initialClusterState: ""
  # Initial cluster token
  initialClusterToken: "etcd-cluster"
  # Data directory inside the container
  dataDir: /var/lib/etcd
  # Enable auto compaction
  autoCompactionMode: periodic
  autoCompactionRetention: "1h"

## @section Security parameters
auth:
  rbac:
    enabled: false
    rootPassword: ""
    existingSecret: ""
  client:
    secureTransport: false
    useAutoTLS: false
    enableAuthentication: false
    existingSecret: ""
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    secureTransport: false
    useAutoTLS: false
    enableAuthentication: false
    existingSecret: ""
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt

## @section Service parameters
service:
  type: ClusterIP
  port: 2379
  peerPort: 2380
  annotations: {}
  clientPortNameOverride: ""
  peerPortNameOverride: ""

## @section Persistence parameters
persistence:
  enabled: true
  ## A StatefulSet's volumeClaimTemplate name is immutable. Changing this against a
  ## cluster that already has an etcd StatefulSet is rejected by the API server, and
  ## the helm-operator then loops in failed-upgrade/rollback — the StatefulSet has to
  ## be deleted (`kubectl delete sts <name> --cascade=orphan`) so Helm can recreate it.
  ## Defaults to "data-v2": the fleet moved to that name when migrating off the Bitnami
  ## chart's /bitnami/etcd layout, and it provisions fresh PVCs rather than reusing the
  ## old ones.
  ## @param persistence.claimName Name for the volumeClaimTemplate.
  claimName: data-v2
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

## @section Pod parameters
podAnnotations: {}
podLabels: {}

securityContext:
  enabled: true
  fsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## @section Resource parameters
resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

## @section PodDisruptionBudget parameters
pdb:
  enabled: true
  minAvailable: 2

## @section Probe parameters
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

startupProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1

## @section PodDisruptionBudget parameters
pdb:
  enabled: true
  minAvailable: 2

## @section Scheduling parameters
nodeSelector: {}
tolerations:
  - key: infoblox.com/do-not-disrupt
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-group-type
              operator: In
              values:
                - stable
priorityClassName: ""

## @section Cluster parameters
clusterDomain: cluster.local

## @section Metrics parameters
metrics:
  enabled: false
  port: 2381
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2381"
  podMonitor:
    enabled: false
    interval: 60s
    scrapeTimeout: 10s

## @section Dashboard parameters
dashboards:
  create: false
  prometheusUid: "000000001"
