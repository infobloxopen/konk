{{- if .Values.hooks.preInstallUpgrade.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "secrets", "configmaps"]
    verbs: ["list", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
subjects:
- kind: ServiceAccount
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "etcd.fullname" . }}-fix-helm-orphans
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "etcd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fix-helm-orphans
    spec:
      serviceAccountName: {{ include "etcd.fullname" . }}-fix-helm-orphans
      restartPolicy: OnFailure
      {{- include "etcd.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: fix-helm-orphans
        image: "{{ .Values.hookImage.repository }}:{{ .Values.hookImage.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.hookImage.pullPolicy }}
        command: ["/usr/local/bin/konk-service", "fix-helm-orphans"]
        env:
        - name: NAMESPACE
          value: {{ .Release.Namespace }}
        - name: RELEASE_NAME
          value: {{ .Release.Name }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
{{- end }}
