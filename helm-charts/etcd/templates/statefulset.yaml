apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "etcd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "etcd.helmAnnotations" . | nindent 4 }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.statefulset.replicaCount }}
  serviceName: {{ include "etcd.headlessServiceName" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "etcd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "etcd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (and .Values.metrics.enabled .Values.metrics.podAnnotations) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        {{- with .Values.metrics.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "etcd.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.runAsNonRoot }}
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: etcd
          image: {{ include "etcd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            runAsUser: {{ .Values.containerSecurityContext.runAsUser }}
            runAsNonRoot: {{ .Values.containerSecurityContext.runAsNonRoot }}
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            {{- if .Values.containerSecurityContext.capabilities }}
            capabilities:
              {{- toYaml .Values.containerSecurityContext.capabilities | nindent 14 }}
            {{- end }}
          {{- end }}
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: {{ .Values.etcd.dataDir }}
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "{{ include "etcd.clientProtocol" . }}://0.0.0.0:{{ .Values.service.port }}"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "{{ include "etcd.clientProtocol" . }}://$(ETCD_NAME).{{ include "etcd.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{ .Values.service.port }}"
            - name: ETCD_LISTEN_PEER_URLS
              value: "{{ include "etcd.peerProtocol" . }}://0.0.0.0:{{ .Values.service.peerPort }}"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "{{ include "etcd.peerProtocol" . }}://$(ETCD_NAME).{{ include "etcd.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{ .Values.service.peerPort }}"
            {{- if gt (int .Values.statefulset.replicaCount) 1 }}
            - name: ETCD_INITIAL_CLUSTER
              value: {{ include "etcd.initialCluster" . | quote }}
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: {{ .Values.etcd.initialClusterToken | quote }}
            - name: ETCD_INITIAL_CLUSTER_STATE
              {{- if .Values.etcd.initialClusterState }}
              value: {{ .Values.etcd.initialClusterState | quote }}
              {{- else if .Release.IsInstall }}
              value: "new"
              {{- else }}
              value: "existing"
              {{- end }}
            {{- end }}
            {{- if .Values.etcd.autoCompactionMode }}
            - name: ETCD_AUTO_COMPACTION_MODE
              value: {{ .Values.etcd.autoCompactionMode | quote }}
            {{- end }}
            {{- if .Values.etcd.autoCompactionRetention }}
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: {{ .Values.etcd.autoCompactionRetention | quote }}
            {{- end }}
            {{- if and .Values.auth.peer.secureTransport .Values.auth.peer.useAutoTLS }}
            - name: ETCD_PEER_AUTO_TLS
              value: "true"
            {{- else if .Values.auth.peer.secureTransport }}
            - name: ETCD_PEER_CERT_FILE
              value: "/etc/etcd/certs/peer/{{ .Values.auth.peer.certFilename }}"
            - name: ETCD_PEER_KEY_FILE
              value: "/etc/etcd/certs/peer/{{ .Values.auth.peer.certKeyFilename }}"
            {{- if .Values.auth.peer.enableAuthentication }}
            - name: ETCD_PEER_CLIENT_CERT_AUTH
              value: "true"
            - name: ETCD_PEER_TRUSTED_CA_FILE
              value: "/etc/etcd/certs/peer/{{ .Values.auth.peer.caFilename }}"
            {{- end }}
            {{- end }}
            {{- if and .Values.auth.client.secureTransport .Values.auth.client.useAutoTLS }}
            - name: ETCD_AUTO_TLS
              value: "true"
            {{- else if .Values.auth.client.secureTransport }}
            - name: ETCD_CERT_FILE
              value: "/etc/etcd/certs/client/{{ .Values.auth.client.certFilename }}"
            - name: ETCD_KEY_FILE
              value: "/etc/etcd/certs/client/{{ .Values.auth.client.certKeyFilename }}"
            {{- if .Values.auth.client.enableAuthentication }}
            - name: ETCD_CLIENT_CERT_AUTH
              value: "true"
            - name: ETCD_TRUSTED_CA_FILE
              value: "/etc/etcd/certs/client/{{ .Values.auth.client.caFilename }}"
            {{- end }}
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: peer
              containerPort: {{ .Values.service.peerPort }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if and .Values.auth.client.secureTransport .Values.auth.client.enableAuthentication }}
            exec:
              command:
                - etcdctl
                - endpoint
                - health
                - --endpoints=https://127.0.0.1:{{ .Values.service.port }}
                - --cacert=/etc/etcd/certs/client/{{ .Values.auth.client.caFilename }}
                - --cert=/etc/etcd/certs/client/{{ .Values.auth.client.certFilename }}
                - --key=/etc/etcd/certs/client/{{ .Values.auth.client.certKeyFilename }}
            {{- else }}
            httpGet:
              path: /health?serializable=true
              port: client
              {{- if .Values.auth.client.secureTransport }}
              scheme: HTTPS
              {{- else }}
              scheme: HTTP
              {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if and .Values.auth.client.secureTransport .Values.auth.client.enableAuthentication }}
            exec:
              command:
                - etcdctl
                - endpoint
                - health
                - --endpoints=https://127.0.0.1:{{ .Values.service.port }}
                - --cacert=/etc/etcd/certs/client/{{ .Values.auth.client.caFilename }}
                - --cert=/etc/etcd/certs/client/{{ .Values.auth.client.certFilename }}
                - --key=/etc/etcd/certs/client/{{ .Values.auth.client.certKeyFilename }}
            {{- else }}
            httpGet:
              path: /health?serializable=true
              port: client
              {{- if .Values.auth.client.secureTransport }}
              scheme: HTTPS
              {{- else }}
              scheme: HTTP
              {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- if and .Values.auth.client.secureTransport .Values.auth.client.enableAuthentication }}
            exec:
              command:
                - etcdctl
                - endpoint
                - health
                - --endpoints=https://127.0.0.1:{{ .Values.service.port }}
                - --cacert=/etc/etcd/certs/client/{{ .Values.auth.client.caFilename }}
                - --cert=/etc/etcd/certs/client/{{ .Values.auth.client.certFilename }}
                - --key=/etc/etcd/certs/client/{{ .Values.auth.client.certKeyFilename }}
            {{- else }}
            httpGet:
              path: /health?serializable=true
              port: client
              {{- if .Values.auth.client.secureTransport }}
              scheme: HTTPS
              {{- else }}
              scheme: HTTP
              {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.persistence.claimName | default "data" }}
              mountPath: {{ .Values.etcd.dataDir }}
            {{- if and .Values.auth.client.secureTransport (not .Values.auth.client.useAutoTLS) }}
            - name: etcd-client-certs
              mountPath: /etc/etcd/certs/client
              readOnly: true
            {{- end }}
            {{- if and .Values.auth.peer.secureTransport (not .Values.auth.peer.useAutoTLS) }}
            - name: etcd-peer-certs
              mountPath: /etc/etcd/certs/peer
              readOnly: true
            {{- end }}
      volumes:
        {{- if and .Values.auth.client.secureTransport (not .Values.auth.client.useAutoTLS) }}
        - name: etcd-client-certs
          secret:
            secretName: {{ required "auth.client.existingSecret is required when auth.client.secureTransport is true" .Values.auth.client.existingSecret }}
            defaultMode: 256
        {{- end }}
        {{- if and .Values.auth.peer.secureTransport (not .Values.auth.peer.useAutoTLS) }}
        - name: etcd-peer-certs
          secret:
            secretName: {{ required "auth.peer.existingSecret is required when auth.peer.secureTransport is true" .Values.auth.peer.existingSecret }}
            defaultMode: 256
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.persistence.claimName | default "data" }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- include "etcd.storageClass" . | nindent 8 }}
  {{- else }}
        - name: {{ .Values.persistence.claimName | default "data" }}
          emptyDir: {}
  {{- end }}
