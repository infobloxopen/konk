apiVersion: v1
kind: Pod
metadata:
  name: {{ include "konk-service.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konk-service.labels" . | nindent 4 }}
  annotations:
    {{- include "konk-service.helmAnnotations" . | nindent 4 }}
    "helm.sh/hook": test-success
    "helm.sh/hook": test
spec:
  containers:
  - name: test-setup
    image: "{{ .Values.kind.image.repository }}:{{ .Values.kind.image.tag | default .Chart.AppVersion }}"
    command: ["/usr/local/bin/konk-service", "test-setup"]
    env:
    - name: KUBECONFIG
      value: /kubeconfig/admin.conf
    - name: GROUP
      value: {{ .Values.group.name }}
    - name: VERSION
      value: {{ .Values.version }}
    - name: KINDS
      value: {{ join "," .Values.group.kinds | quote }}
    volumeMounts:
    - name: kubeconfig
      mountPath: /kubeconfig
      readOnly: true
  restartPolicy: Never
  volumes:
  - name: kubeconfig
    secret:
      secretName: {{ include "konk-service.fullname" . }}-kubeconfig