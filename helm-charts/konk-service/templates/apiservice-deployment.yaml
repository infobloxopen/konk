apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konk-service.fullname" . | trunc 51 | trimSuffix "-" }}-apiservice
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "konk-service.helmAnnotations" . | nindent 4 }}
  labels:
    {{- include "konk-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "konk-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiservice
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/apiservice-configmap.yaml") . | sha256sum }}
        checksum/values: {{ print .Values | sha256sum }}
      labels:
        {{- include "konk-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiservice
    spec:
      serviceAccountName: {{ include "konk-service.serviceAccountName" . }}
      containers:
      - name: apiservice
        securityContext:
          {{- toYaml .Values.kind.securityContext | nindent 10 }}
        image: "{{ .Values.kind.image.repository }}:{{ .Values.kind.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.kind.image.pullPolicy }}
        command: ["/usr/local/bin/konk-service", "reconcile-apiservice"]
        env:
          - name: SERVICENAME
            value: {{ .Values.service.name }}
          - name: NAMESPACE
            value: {{ .Release.Namespace }}
          - name: KUBECONFIG
            value: /etc/kubernetes/admin.conf
          - name: CERT_DIR
            value: /certs
          - name: MANIFESTS
            valueFrom:
              configMapKeyRef:
                name: {{ include "konk-service.fullname" . }}-mounts
                key: api-service.yaml.in
          {{- if .Values.crds }}
          - name: CRDS
            value: install
          - name: CRD_MANIFESTS
            valueFrom:
              configMapKeyRef:
                name: {{ include "konk-service.fullname" . }}-mounts
                key: crds.yaml
                optional: true
          {{- end }}
        resources:
          {{- toYaml .Values.kind.resources | nindent 10 }}
        volumeMounts:
        - name: kubeconfig
          mountPath: "/etc/kubernetes"
          readOnly: true
        - name: ca-cert
          mountPath: "/certs"
          readOnly: true
        - name: tmp
          mountPath: "/tmp"
        readinessProbe:
          exec:
            command: ["/usr/local/bin/konk-service", "healthz", "/tmp/healthy"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: kubeconfig
        secret:
          secretName: {{ include "konk-service.fullname" . }}-kubeconfig
      - name: ca-cert
        secret:
          secretName: {{ if .Values.service.caSecretName -}}
          {{ .Values.service.caSecretName }}
          {{- else -}}
          {{ include "konk-service.fullname" . }}-server
          {{- end }}
      - name: tmp
        emptyDir: {}
