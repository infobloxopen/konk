# Default values for konk-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

space:
  enabled: false

# -- annotations to add to the APIService created in Konk by KonkService
annotations: {}

# -- konk-tools image used for kubectl utility containers (replaces kindest/node)
# Contains only statically-linked kubectl + busybox shell on distroless base.
kind:
  image:
    repository: infoblox/konk-tools
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 32Mi
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts:
    - host: localhost
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

konk:
  # konk.name -- should be set to the konk-name
  name: ""
  namespace: ""
  # -- scope of the konk, must match `.scope` of the Konk
  #
  scope: ""

service:
  # -- Required to be set to the name of the service to be registered in Konk
  name: test
  # -- Optional reference to the secret the service's CA certs are stored in.
  # When omitted, KonkService will generate a CA to be used by the APIService.
  caSecretName:

crds: null

group:
  # -- https://kubernetes.io/docs/reference/using-api/#api-groups
  name: example.infoblox.com
  # -- resource types provided by your API service.
  # This list is used to setup default RBAC policies.
  kinds:
  - "*"
  # -- actions to allow on your API service.
  # This list is used to setup default RBAC policies.
  verbs:
  - "*"

version: v1alpha1

insecureSkipTLSVerify: false
