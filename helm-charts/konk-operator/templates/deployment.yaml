apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konk-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konk-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "konk-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "konk-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "konk-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: fix-helm-orphans
          image: "{{ .Values.relatedImages.kindRepository }}:{{ .Values.relatedImages.kind }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/konk-service", "fix-helm-orphans-init"]
          {{- if .Values.initOrphanFix }}
          {{- if .Values.initOrphanFix.skip }}
          env:
            - name: SKIP_ORPHAN_FIX
              value: "true"
          {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AUTH_URL
              value: {{ .Values.authURL | default "" }}
            - name: CERT_MANAGER_NAMESPACE
              value: {{ (index .Values "cert-manager").namespace }}
            - name: SPACE
              value: {{ .Values.space.enabled | default "" | quote }}
            - name: VAULT_PATH
              value: {{ .Values.vaultCommon.imagepullsecret.path | default "" }}
            - name: RELATED_IMAGE_APISERVER
              value: {{ .Values.relatedImages.apiserver | default "" | quote }}
            - name: RELATED_IMAGE_PROVISION
              value: {{ .Values.relatedImages.provision | default "" | quote }}
            - name: RELATED_IMAGE_KIND
              value: {{ .Values.relatedImages.kind | default "" | quote }}
            - name: RELATED_IMAGE_APISERVER_REPO
              value: {{ .Values.relatedImages.apiserverRepository | default "" | quote }}
            - name: RELATED_IMAGE_PROVISION_REPO
              value: {{ .Values.relatedImages.provisionRepository | default "" | quote }}
            - name: RELATED_IMAGE_KIND_REPO
              value: {{ .Values.relatedImages.kindRepository | default "" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
