apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konk-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konk-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /*
  Recreate, not the default RollingUpdate. With replicas: 1 the defaults are
  maxUnavailable: 25% (floor -> 0) and maxSurge: 25% (ceil -> 1), so one pod
  must stay Available and the new pod is required to become Ready BEFORE the
  old one is removed. That guarantees a window where two operators reconcile
  the same Konk/Etcd CRs at once, with no leader election to arbitrate: both
  drive Helm releases for the same CR and corrupt each other's release
  history ("release: already exists", "sh.helm.release.v1.<rel>.vN not found",
  "rollback failed: release has no N version").

  The overlap also breaks the fix-helm-orphans init container below, whose
  whole premise is starting from a clean slate: it deletes non-deployed
  release secrets, and pending-upgrade is indistinguishable from an upgrade
  the outgoing operator is running right now.

  Recreate costs a few seconds with no operator running. Reconciliation
  resumes on startup and nothing is lost, which is the right trade for a
  singleton that owns Helm releases.
  */}}
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "konk-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
      Never emit prometheus.io scrape annotations while the PodMonitor is
      collecting. Alloy's annotation discovery and its
      prometheus.operator.podmonitors component both run with no selector, so a
      pod carrying both is scraped TWICE and every series is duplicated, the two
      copies differing only in job/instance. Same gate the etcd chart uses
      (#689/#699); konk-operator previously had none, which is why DC had to
      null podAnnotations per cluster by hand.
      */}}
      {{- $scrapeAnnotations := and .Values.metrics.enabled (not .Values.metrics.podMonitor.enabled) .Values.metrics.podAnnotations }}
      {{- if or .Values.podAnnotations $scrapeAnnotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $scrapeAnnotations }}
        {{- with .Values.metrics.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "konk-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "konk-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initOrphanFix.enabled }}
      initContainers:
        - name: fix-helm-orphans
          image: "{{ include "konk-operator.imageRepo" (dict "ctx" . "repo" .Values.relatedImages.kindRepository) }}:{{ .Values.relatedImages.kind | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/konk-service", "fix-helm-orphans-init"]
          {{- if .Values.initOrphanFix.skip }}
          env:
            - name: SKIP_ORPHAN_FIX
              value: "true"
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "konk-operator.imageRepo" (dict "ctx" . "repo" .Values.image.repository) }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # operator-sdk framework metrics, plain HTTP. Named so the
            # PodMonitor can reference it; 8081 is the probe port.
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: AUTH_URL
              value: {{ .Values.authURL | default "" }}
            - name: CERT_MANAGER_NAMESPACE
              value: {{ (index .Values "cert-manager").namespace }}
            - name: SPACE
              value: {{ .Values.space.enabled | default "" | quote }}
            - name: VAULT_PATH
              value: {{ .Values.vaultCommon.imagepullsecret.path | default "" }}
            - name: RELATED_IMAGE_APISERVER
              value: {{ .Values.relatedImages.apiserver | default .Chart.AppVersion | quote }}
            - name: RELATED_IMAGE_PROVISION
              value: {{ .Values.relatedImages.provision | default .Chart.AppVersion | quote }}
            - name: RELATED_IMAGE_KIND
              value: {{ .Values.relatedImages.kind | default .Chart.AppVersion | quote }}
            - name: RELATED_IMAGE_APISERVER_REPO
              value: {{ include "konk-operator.imageRepo" (dict "ctx" . "repo" .Values.relatedImages.apiserverRepository) | quote }}
            - name: RELATED_IMAGE_PROVISION_REPO
              value: {{ include "konk-operator.imageRepo" (dict "ctx" . "repo" .Values.relatedImages.provisionRepository) | quote }}
            - name: RELATED_IMAGE_KIND_REPO
              value: {{ include "konk-operator.imageRepo" (dict "ctx" . "repo" .Values.relatedImages.kindRepository) | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
