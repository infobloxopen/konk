{{- if .Values.dashboards.create }}
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: {{ include "konk-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    integreatly.org/operator: appinfra-grafana
    {{- include "konk-operator.labels" . | nindent 4 }}
spec:
  customFolderName: "konk"
  json: |-
    {{- /*
    KONK_OPERATOR_INSTANCE is the app.kubernetes.io/instance label the operator's
    own pods carry, which is .Release.Name -- not necessarily "konk-operator".
    Substituted here so the operator-metric panels resolve for any release name.
    */}}
    {{- .Files.Get "dashboards/konk-operator.json" | replace "${DS_PROMETHEUS_UID}" .Values.dashboards.prometheusUid | replace "${KONK_OPERATOR_INSTANCE}" .Release.Name | nindent 4  }}
{{- end }}
