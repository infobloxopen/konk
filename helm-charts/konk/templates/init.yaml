apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konk.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konk.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "konk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: init
  template:
    metadata:
      labels:
        {{- include "konk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: {{ include "konk.serviceAccountName" . }}
      containers:
      - name: provision
        securityContext:
          {{- toYaml .Values.provision.securityContext | nindent 10 }}
        image: "{{ .Values.provision.image.repository }}:{{ .Values.provision.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.provision.image.pullPolicy }}
        env:
          {{- with .Values.certManager.namespace }}
          - name: CERT_MANAGER_NAMESPACE
            value: {{ . }}
          {{- end }}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: FULLNAME
            value: {{ include "konk.fullname" . }}
          - name: LABELS
            value: {{ (include "konk.selectorLabels" .) | replace ": " "=" | replace "\n" " " }}
          - name: RELEASE
            value: {{ .Release.Name }}
          - name: SCOPE
            value: {{ .Values.scope }}
        resources:
          {{- toYaml .Values.provision.resources | nindent 10 }}
