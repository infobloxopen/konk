apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "konk.fullname" . }}-scripts
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "konk.helmAnnotations" . | nindent 4 }}
  labels:
    {{- include "konk.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "scripts/provision.sh").AsConfig | indent 2 }}
