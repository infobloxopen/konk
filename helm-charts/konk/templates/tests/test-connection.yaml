apiVersion: v1
kind: Pod
metadata:
  name: {{ include "konk.fullname" . }}-test-connection
  labels:
    {{- include "konk.labels" . | nindent 4 }}
  annotations:
    {{- include "konk.helmAnnotations" . | nindent 4 }}
    "helm.sh/hook": test-success
    "helm.sh/hook": test
spec:
  containers:
  - name: test-connection
    image: "{{ .Values.kind.image.repository }}:{{ .Values.kind.image.tag | default .Chart.AppVersion }}"
    imagePullPolicy: {{ .Values.kind.image.pullPolicy }}
    command: ["/usr/local/bin/konk-service", "test-connection"]
    env:
    - name: KUBECONFIG
      value: /kubeconfig/admin.conf
    - name: KONK_ENDPOINT
      value: "https://{{ include "konk.fullname" . }}:6443"
    - name: TLS_CA_PATH
      value: /nginx/ca.crt
    - name: TLS_CERT_PATH
      value: /nginx/tls.crt
    - name: TLS_KEY_PATH
      value: /nginx/tls.key
    resources:
      {{- toYaml .Values.kind.resources | nindent 6 }}
    volumeMounts:
    - mountPath: /nginx/
      name: nginx-client
      readOnly: true
    - mountPath: /kubeconfig/
      name: kubeconfig
      readOnly: true
  volumes:
  - name: kubeconfig
    secret:
      secretName: {{ include "konk.fullname" . }}-kubeconfig
  - name: nginx-client
    secret:
      secretName: {{ include "konk.fullname" . }}-ingress-client
  restartPolicy: Never
