# Default values for konk.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

apiserver:
  image:
    repository: ghcr.io/infobloxopen/konk-app
    pullPolicy: IfNotPresent
    # -- Overrides the image tag
    # @default -- default is the chart appVersion.
    tag: ""
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 20m
      memory: 160Mi
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  startupProbe: true
  remoteHeaders:
    # -- sets kube-apiserver's `--requestheader-extra-headers-prefix` option.
    # See https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/ for details.
    requestheader-extra-headers-prefix: X-Remote-Extra-
    # -- sets kube-apiserver's `--requestheader-group-headers` option.
    requestheader-group-headers: X-Remote-Group
    # -- sets kube-apiserver's `--requestheader-username-headers` option.
    requestheader-username-headers: X-Remote-User
  # -- additional command line flags for kube-apiserver.
  # See https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/ for details.
  extraFlags: {}
  # -- specifies APIs unavailable in Konk.
  disabledAPIs:
    - apps/v1
    - apps/v1beta1
    - autoscaling/v1
    - autoscaling/v2beta1
    - autoscaling/v2beta2
    - batch/v1
    - batch/v1beta1
    - networking.k8s.io/v1
    - networking.k8s.io/v1beta1
    - storage.k8s.io/v1
    - storage.k8s.io/v1beta1

certManager:
  # When using cluster-scoped konks, the cert-manager namespace must be provided.
  # Konk will create CA secrets for use by ClusterIssuers in cert-manager's namespace.
  namespace:

etcd:
  # etcd image configuration - uses Chainguard etcd from cgr.dev/infoblox.com
  image:
    registry: cgr.dev
    repository: infoblox.com/etcd
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 128Mi
  tolerations:
    - key: infoblox.com/do-not-disrupt
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-group-type
                operator: In
                values:
                  - stable
  securityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # -- defines how Konk's internal etcd is deployed.
  # `true`: etcd is deployed by konk-operator
  # `false`: etcd is deployed as a sidecar of konk's kube-apiserver
  operator: true
  
  # Number of etcd replicas
  replicaCount: 3
  
  # Persistence settings
  persistence:
    enabled: true
    size: 8Gi

# -- provision is the init container that generates certs and kubeconfigs
provision:
  image:
    repository: ghcr.io/infobloxopen/konk-provision
    pullPolicy: IfNotPresent
    # -- Overrides the image tag
    # @default -- default is the chart appVersion.
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false

# -- konk-service Go binary image used for test pods (replaces shell-based konk-tools)
# Contains a single statically-linked Go binary on a distroless base.
# No shell, no busybox — all kubectl/shell logic is implemented in Go.
kind:
  image:
    repository: ghcr.io/infobloxopen/konk-service
    pullPolicy: IfNotPresent
    # -- Overrides the image tag
    # @default -- default is the chart appVersion.
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 32Mi
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- scope can be `cluster` or `namespace`.
# When scope is `cluster`, Certificates in any namespace can be signed by the konk's Issuer.
scope: namespace

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

space:
  enabled: false

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

service:
  type: ClusterIP
  port: 6443

ingress:
  enabled: false
  className: ""
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Helm lifecycle hooks
hooks:
  preInstallUpgrade:
    enabled: true
