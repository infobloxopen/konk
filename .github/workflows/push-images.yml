name: Build and push images to GHCR

on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Images
      env:
        BUILDKIT_PROGRESS: plain
      run: |
        make docker-build
        make docker-build-kubernetes
        make docker-build-provision
        make docker-build-konk-service
    - name: Push Images to GHCR
      env:
        BUILDKIT_PROGRESS: plain
      run: |
        make docker-push
        make docker-push-kubernetes
        make docker-push-provision
        make docker-push-konk-service
    - name: Tag :latest and push to GHCR
      if: github.ref == 'refs/heads/main'
      env:
        BUILDKIT_PROGRESS: plain
      run: |
        GIT_VERSION=$(git describe --dirty=-unsupported --always --long --tags)
        K8S_RELEASE=$(grep '^K8S_RELEASE' Makefile | head -1 | awk -F'?= ' '{print $2}')
        GIT_SHORT=g$(git rev-parse --short HEAD)
        for img in konk konk-provision konk-service; do
          docker tag ghcr.io/infobloxopen/${img}:${GIT_VERSION} ghcr.io/infobloxopen/${img}:latest
          docker push ghcr.io/infobloxopen/${img}:latest
        done
        docker tag ghcr.io/infobloxopen/konk-app:${K8S_RELEASE}-${GIT_SHORT} ghcr.io/infobloxopen/konk-app:latest
        docker push ghcr.io/infobloxopen/konk-app:latest
