name: PR # End-to-end tests
on: pull_request
jobs:
  end2end:
    name: End To End
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ingressVersion:
          - "" # uses makefile default (stable version)
        isUpgrade:
          - false
        k8sVersion:
          #- v1.32.8 this fails
          - v1.31.4
          - v1.25.11
        include:
          - isUpgrade: true
            k8sVersion: v1.25.11
            ref: main
          - ingressVersion: controller-v1.5.1
            k8sVersion: v1.25.11
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -ex -o pipefail {0}
        working-directory: ./src/github.com/${{ github.repository }}
    env:
      GOPATH: ${{ github.workspace }}
      KONK_NAMESPACE: baz
      PRINT_DEBUG: |
        set +x
        while read cmd
        do
          echo "::group::$cmd"
          $cmd
          echo "::endgroup::"
        done <<< "git diff
        helm list --all-namespaces
        kubectl describe po,ing,certificate,clusterissuer,issuer,konk,konkservice -A
        kubectl get po,rs,svc,ep,certificate,clusterissuer,issuer,ingress,secrets,configmap -A
        kubectl logs -l app.kubernetes.io/name=etcd -n $KONK_NAMESPACE
        kubectl logs -l app.kubernetes.io/component=apiserver -n $KONK_NAMESPACE
        kubectl logs -l app.kubernetes.io/name=konk-operator
        kubectl logs -l app.kubernetes.io/component=controller,app.kubernetes.io/name=example-apiserver
        kubectl logs -l app.kubernetes.io/component=apiserver,app.kubernetes.io/name=example-apiserver -c example-apiserver
        kubectl logs -l app.kubernetes.io/component=controller -n ingress-nginx"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: ./src/github.com/${{ github.repository }}
          ref: ${{ matrix.ref }}
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.isUpgrade }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true
      - name: Fetch tags
        run: |
          git fetch --prune --unshallow
      - name: Free space by removing unnecessary files
        run: |
          sudo rm -rf /usr/local/lib/android
      - name: ingress version
        if: ${{ ! matrix.ingressVersion }}
        run: |
          echo "ingress_version=$(
            curl -sS --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/kubernetes/ingress-nginx/releases | jq '[.[] | select(.draft==false and .prerelease==false and (.tag_name | startswith("controller-"))) | .tag_name][0]' -r
          )" >> $GITHUB_ENV
      - name: Helm Lint
        run: |
          mkdir -p ~/.kube
          make helm-lint
      - uses: helm/kind-action@v1.12.0
        timeout-minutes: 5
        with:
          config: ./src/github.com/${{ github.repository }}/test/kind.yaml
          node_image: kindest/node:${{ matrix.k8sVersion }}
      - name: Deploy charts
        timeout-minutes: 2
        run: |
          kubectl cluster-info
          make deploy-cert-manager deploy-ingress-nginx INGRESS_VERSION=${{ matrix.ingressVersion || env.ingress_version }}
      - name: Install konk-operator
        if: ${{ matrix.isUpgrade }}
        timeout-minutes: 15
        run: |
          # Pin GIT_VERSION for the whole upgrade leg so both `make` invocations
          # (this step and the subsequent "Install/Upgrade konk-operator" step,
          # run from a different checkout) build & reference the same image
          # tags and produce identical helm overrideValues. Without this, the
          # operator-led `runner-konk` release rewrites on the second pass and
          # `helm test runner-konk` cannot find it.
          GIT_VERSION="$(git describe --always --long --tags)"
          echo "GIT_VERSION=${GIT_VERSION}" >> "$GITHUB_ENV"
          make kind-load-konk KIND_NAME="chart-testing" GIT_VERSION="${GIT_VERSION}"
          make deploy-konk-operator GIT_VERSION="${GIT_VERSION}"
          kubectl create ns $KONK_NAMESPACE || true
          kubectl create -n $KONK_NAMESPACE -f examples/konk.yaml
          until kubectl wait -n $KONK_NAMESPACE --timeout=3m --for=condition=ready pod -l app.kubernetes.io/component=apiserver,app.kubernetes.io/name=konk
          do
            sleep 1
          done
      - name: Checkout code
        if: ${{ matrix.isUpgrade }}
        uses: actions/checkout@v5
        with:
          path: ./src/github.com/${{ github.repository }}
      - name: Fetch tags
        if: ${{ matrix.isUpgrade }}
        run: |
          git fetch --prune --unshallow
      - name: Install/Upgrade konk-operator
        timeout-minutes: 10
        run: |
          # Reuse the pinned GIT_VERSION from the upgrade leg's first install
          # (set above via $GITHUB_ENV). For the non-upgrade legs GIT_VERSION
          # is empty and the Makefile falls back to `git describe`.
          if [ -n "${GIT_VERSION:-}" ]; then
            make kind-load-konk KIND_NAME="chart-testing" GIT_VERSION="${GIT_VERSION}"
            make deploy-crds deploy-konk-operator GIT_VERSION="${GIT_VERSION}"
          else
            make kind-load-konk KIND_NAME="chart-testing"
            make deploy-crds deploy-konk-operator
          fi
      - name: Test Konk
        timeout-minutes: 6
        run: |
          kubectl create ns $KONK_NAMESPACE || true
          kubectl apply -n $KONK_NAMESPACE -f examples/konk.yaml
          # Wait a bit for operator to reconcile, then dump debug info
          sleep 30
          echo "::group::Debug - pods in all namespaces"
          kubectl get pods -A
          echo "::endgroup::"
          echo "::group::Debug - pods in $KONK_NAMESPACE"
          kubectl get pods -n $KONK_NAMESPACE -o wide
          echo "::endgroup::"
          echo "::group::Debug - events in $KONK_NAMESPACE"
          kubectl get events -n $KONK_NAMESPACE --sort-by='.lastTimestamp'
          echo "::endgroup::"
          echo "::group::Debug - describe pods in $KONK_NAMESPACE"
          kubectl describe pods -n $KONK_NAMESPACE
          echo "::endgroup::"
          echo "::group::Debug - Konk CR status"
          kubectl get konk -n $KONK_NAMESPACE -o yaml
          echo "::endgroup::"
          echo "::group::Debug - Etcd CR"
          kubectl get etcd -n $KONK_NAMESPACE -o yaml 2>/dev/null || echo "No Etcd CR found"
          echo "::endgroup::"
          echo "::group::Debug - secrets in $KONK_NAMESPACE"
          kubectl get secrets -n $KONK_NAMESPACE
          echo "::endgroup::"
          echo "::group::Debug - operator logs"
          kubectl logs -l app.kubernetes.io/name=konk-operator --tail=100
          echo "::endgroup::"
          echo "::group::Debug - init/provision logs"
          kubectl logs -n $KONK_NAMESPACE -l app.kubernetes.io/component=init --tail=100 2>/dev/null || echo "No init pod logs"
          echo "::endgroup::"
          # FIXME: use the helm-operator status to detect installation was successful
          until kubectl wait -n $KONK_NAMESPACE --timeout=3m --for=condition=ready pod -l app.kubernetes.io/name=etcd
          do
            sleep 1
          done
          until kubectl wait -n $KONK_NAMESPACE --timeout=3m --for=condition=ready pod -l app.kubernetes.io/component=apiserver,app.kubernetes.io/name=konk
          do
            sleep 1
          done
          echo "::group::Debug - helm releases (all namespaces)"
          docker run --rm --network host \
            -v ${HOME}/.kube:/root/.kube \
            -e KUBECONFIG=/root/.kube/config \
            infoblox/helm:3 helm list -A || true
          echo "::endgroup::"
          make test-konk KONK_NAMESPACE=$KONK_NAMESPACE
          make test-konk-local
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.15.x
      - name: Build Extension APIServer
        timeout-minutes: 7
        run: |
          make kind-load-apiserver KIND_NAME="chart-testing"
      - name: Deploy Extension APIServer
        timeout-minutes: 10
        run: |
          # deploy example-apiserver using a passed KONK reference
          # helm --wait ensures all deployments are ready, including the controller
          # whose init container waits for the contacts resource in konk
          make deploy-example-apiserver KIND_NAME="chart-testing" \
            HELM_FLAGS="--set=konk.name=runner-konk --set=konk.namespace=$KONK_NAMESPACE --set=konk.create=false --set=image.pullPolicy=IfNotPresent" || {
            echo "::group::Debug - pods after deploy-example-apiserver failure"
            kubectl get pods -A
            echo "::endgroup::"
            echo "::group::Debug - describe controller pod"
            kubectl describe pods -l app.kubernetes.io/component=controller,app.kubernetes.io/name=example-apiserver
            echo "::endgroup::"
            echo "::group::Debug - controller init container logs"
            kubectl logs -l app.kubernetes.io/component=controller,app.kubernetes.io/name=example-apiserver -c wait-for-resource --tail=50 2>/dev/null || echo "No init container logs"
            echo "::endgroup::"
            echo "::group::Debug - events in default namespace"
            kubectl get events --sort-by='.lastTimestamp' | tail -30
            echo "::endgroup::"
            echo "::group::Debug - konk-service secrets/kubeconfig"
            kubectl get secrets -A | grep -i kubeconfig
            echo "::endgroup::"
            echo "::group::Debug - konkservice status"
            kubectl get konkservice -A -o yaml 2>/dev/null || echo "No konkservice found"
            echo "::endgroup::"
            exit 1
          }
      - name: Test Extension APIServer
        run: |
          make test-apiserver
          # Test konkservice deployed
          make test-apiserver-konk-service
          kubectl wait --timeout=1m --for=condition=ready pod -l app.kubernetes.io/name=konk-service,app.kubernetes.io/component=apiservice-test
      - name: Test ingress
        timeout-minutes: 1
        run: |
          kubectl -n ingress-nginx logs -l app.kubernetes.io/component=controller --tail 0 -f &
          until kubectl -s localhost:80 get contacts
          do
            sleep 3
          done
      - name: Print debug
        if: ${{ always() }}
        run: bash -c "$PRINT_DEBUG"
      - name: Test delete
        timeout-minutes: 3
        run: |
          helm list --all-namespaces
          kubectl delete konks,konkservices --all --all-namespaces
          [ -z "$(helm list --all-namespaces --filter '^runner-.*konk(-service)?$' | tee /dev/stderr | grep konk)" ]
      - name: Print debug
        if: ${{ always() }}
        run: bash -c "$PRINT_DEBUG"
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - run: make chart-readmes
      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: update chart readme
          add: helm-charts
          push: origin HEAD:${{ github.head_ref }}
